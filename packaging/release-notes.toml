# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.2.0"

[locales."en-us"]
whats-new = """
Peilung now runs on iPhone as well as Apple Watch. The iPhone app does everything the watch app does: compass and bearings with tap cues, navigation to a point, the odometer, your coordinates and marks. Where the watch uses the Digital Crown, the iPhone takes a drag or a tap. With both, the goal you are navigating to, your marks, the odometer and your settings are shared, so a change on one shows on the other.
"""
